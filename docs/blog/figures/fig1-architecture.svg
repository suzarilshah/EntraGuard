<svg xmlns="http://www.w3.org/2000/svg" width="1252" height="570"
     viewBox="0 0 1252 570" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a8886"/>
    </marker>
  </defs>
  <rect width="1252" height="570" fill="#ffffff"/>
  <title>EntraGuard architecture</title>
<text x="40" y="34" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1b1a19" font-weight="600" text-anchor="start">Figure 1 — What talks to what, and over which protocol</text>
<text x="40" y="56" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#605e5c" font-weight="400" text-anchor="start">Every arrow is a real protocol on a real wire. Nothing here is illustrative.</text>
<rect x="40" y="92" width="236" height="92" rx="6" fill="#eff6fc" stroke="#0f6cbd" stroke-width="1.5"/>
<text x="54" y="116" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#0f6cbd">Contoso Treasury</text>
<text x="54" y="137" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#605e5c">Next.js · the relying party</text>
<text x="54" y="154" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#605e5c">MSAL sign-in, then asks</text>
<text x="54" y="171" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#605e5c">EntraGuard for a step-up</text>
<rect x="40" y="212" width="236" height="92" rx="6" fill="#eff6fc" stroke="#0f6cbd" stroke-width="1.5"/>
<text x="54" y="236" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#0f6cbd">EntraGuard console</text>
<text x="54" y="257" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#605e5c">Next.js · server-side KQL</text>
<text x="54" y="274" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#605e5c">Four blades, all live data</text>
<text x="54" y="291" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#605e5c">No secrets in the browser</text>
<rect x="452" y="128" width="268" height="150" rx="6" fill="#effbef" stroke="#0e700e" stroke-width="1.5"/>
<text x="466" y="152" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#0e700e">Media service (.NET 9)</text>
<text x="466" y="173" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#605e5c">Verification state machine</text>
<text x="466" y="190" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#605e5c">Coercion analyst · policy gate</text>
<text x="466" y="207" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#605e5c">Voice capture and scoring</text>
<text x="466" y="224" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#605e5c">Risk scoring · fault recorder</text>
<text x="466" y="241" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#605e5c">Container Apps, one replica</text>
<rect x="952" y="40" width="260" height="76" rx="6" fill="#f3f2f1" stroke="#8a8886" stroke-width="1.5"/>
<text x="966" y="64" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#1b1a19">Azure Communication</text>
<text x="966" y="85" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#605e5c">Call Automation places the call</text>
<text x="966" y="102" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#605e5c">Unmixed PCM 24 kHz, duplex</text>
<rect x="952" y="140" width="260" height="76" rx="6" fill="#f3f2f1" stroke="#8a8886" stroke-width="1.5"/>
<text x="966" y="164" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#1b1a19">Microsoft Teams</text>
<text x="966" y="185" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#605e5c">Cross-tenant federation</text>
<text x="966" y="202" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#605e5c">The call rings in Teams</text>
<rect x="952" y="240" width="260" height="76" rx="6" fill="#f3f2f1" stroke="#8a8886" stroke-width="1.5"/>
<text x="966" y="264" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#1b1a19">Azure OpenAI</text>
<text x="966" y="285" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#605e5c">Analyst scores the transcript</text>
<text x="966" y="302" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#605e5c">every 3s over a 45s window</text>
<rect x="952" y="340" width="260" height="76" rx="6" fill="#f3f2f1" stroke="#8a8886" stroke-width="1.5"/>
<text x="966" y="364" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#1b1a19">Voiceprint sidecar</text>
<text x="966" y="385" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#605e5c">FastAPI + SpeechBrain ECAPA</text>
<text x="966" y="402" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#605e5c">Internal ingress, kept warm</text>
<rect x="452" y="320" width="268" height="96" rx="6" fill="#fff8e6" stroke="#8a6100" stroke-width="1.5"/>
<text x="466" y="344" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#8a6100">Microsoft Entra ID</text>
<text x="466" y="365" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#605e5c">Graph: auditLogs/signIns</text>
<text x="466" y="382" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#605e5c">supplies the live questions</text>
<text x="466" y="399" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#605e5c">Workload identity federation</text>
<rect x="452" y="456" width="760" height="84" rx="6" fill="#f3f2f1" stroke="#8a8886" stroke-width="1.5"/>
<text x="466" y="480" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#1b1a19">Microsoft Sentinel · Log Analytics</text>
<text x="466" y="501" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#605e5c">Verification_CL · Biometric_CL · Fault_CL · CallAnalysis_CL · Remediation_CL</text>
<text x="466" y="518" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#605e5c">Logs Ingestion API through a DCE and a DCR — remember the DCR, it bites later</text>
<line x1="276" y1="150" x2="452" y2="172" stroke="#0f6cbd" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="364" y="148" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#0f6cbd" font-weight="600" text-anchor="middle">POST /api/verify/start</text>
<line x1="452" y1="250" x2="276" y2="262" stroke="#0f6cbd" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="364" y="246" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#0f6cbd" font-weight="600" text-anchor="middle">KQL, server-side</text>
<line x1="720" y1="150" x2="952" y2="78" stroke="#8a8886" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="836" y="100" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#605e5c" font-weight="600" text-anchor="middle">CreateCall</text>
<line x1="720" y1="185" x2="952" y2="178" stroke="#8a8886" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="836" y="172" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#605e5c" font-weight="600" text-anchor="middle">WebSocket · unmixed audio</text>
<line x1="720" y1="220" x2="952" y2="278" stroke="#8a8886" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="836" y="246" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#605e5c" font-weight="600" text-anchor="middle">45s transcript window</text>
<line x1="720" y1="255" x2="952" y2="378" stroke="#8a8886" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="836" y="330" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#605e5c" font-weight="600" text-anchor="middle">PCM 16 kHz → 192-d embedding</text>
<line x1="1082" y1="116" x2="1082" y2="140" stroke="#8a8886" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="1092" y="134" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#605e5c" font-weight="400" text-anchor="start">interop</text>
<line x1="586" y1="278" x2="586" y2="320" stroke="#8a6100" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="586" y1="416" x2="586" y2="456" stroke="#8a8886" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="40" y="352" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1b1a19" font-weight="600" text-anchor="start">The phone never talks</text>
<text x="40" y="372" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#605e5c" font-weight="400" text-anchor="start">to EntraGuard directly.</text>
<text x="40" y="390" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#605e5c" font-weight="400" text-anchor="start">It answers a Teams call,</text>
<text x="40" y="408" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#605e5c" font-weight="400" text-anchor="start">and that is the point: the</text>
<text x="40" y="426" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#605e5c" font-weight="400" text-anchor="start">channel is a managed</text>
<text x="40" y="444" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#605e5c" font-weight="400" text-anchor="start">identity, not a phone number.</text>
</svg>