<svg xmlns="http://www.w3.org/2000/svg" width="950" height="686"
     viewBox="0 0 950 686" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a8886"/>
    </marker>
  </defs>
  <rect width="950" height="686" fill="#ffffff"/>
  <title>Verification call flow</title>
<text x="40" y="34" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1b1a19" font-weight="600" text-anchor="start">Figure 2 — One verification call, second by second</text>
<text x="40" y="56" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#605e5c" font-weight="400" text-anchor="start">Time runs downward. The right-hand column is what the system is doing while the caller talks.</text>
<rect x="40" y="86" width="110" height="46" rx="5" fill="#eff6fc" stroke="#0f6cbd" stroke-width="1.4"/>
<text x="52" y="114" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#0f6cbd" font-weight="600" text-anchor="start">Browser</text>
<rect x="168" y="86" width="742" height="46" rx="5" fill="#ffffff" stroke="#8a8886" stroke-width="1"/>
<text x="182" y="114" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1b1a19" font-weight="400" text-anchor="start">User signs in to Contoso Treasury and asks to release a payment run.</text>
<line x1="95" y1="132" x2="95" y2="146" stroke="#8a8886" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="40" y="146" width="110" height="46" rx="5" fill="#eff6fc" stroke="#0f6cbd" stroke-width="1.4"/>
<text x="52" y="174" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#0f6cbd" font-weight="600" text-anchor="start">Screen</text>
<rect x="168" y="146" width="742" height="46" rx="5" fill="#ffffff" stroke="#8a8886" stroke-width="1"/>
<text x="182" y="174" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1b1a19" font-weight="400" text-anchor="start">A two-digit number appears in the browser. It is never sent to the phone.</text>
<line x1="95" y1="192" x2="95" y2="206" stroke="#8a8886" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="40" y="206" width="110" height="46" rx="5" fill="#f3f2f1" stroke="#8a8886" stroke-width="1.4"/>
<text x="52" y="234" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8a8886" font-weight="600" text-anchor="start">Teams</text>
<rect x="168" y="206" width="742" height="46" rx="5" fill="#ffffff" stroke="#8a8886" stroke-width="1"/>
<text x="182" y="234" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1b1a19" font-weight="400" text-anchor="start">The phone rings. EntraGuard speaks: enter the number on your keypad.</text>
<line x1="95" y1="252" x2="95" y2="266" stroke="#8a8886" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="40" y="266" width="110" height="46" rx="5" fill="#f3f2f1" stroke="#8a8886" stroke-width="1.4"/>
<text x="52" y="294" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8a8886" font-weight="600" text-anchor="start">Keypad</text>
<rect x="168" y="266" width="742" height="46" rx="5" fill="#ffffff" stroke="#8a8886" stroke-width="1"/>
<text x="182" y="294" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1b1a19" font-weight="400" text-anchor="start">DTMF arrives on two independent paths. Both are de-duplicated to one entry.</text>
<line x1="95" y1="312" x2="95" y2="326" stroke="#8a8886" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="40" y="326" width="110" height="46" rx="5" fill="#fff8e6" stroke="#8a6100" stroke-width="1.4"/>
<text x="52" y="354" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8a6100" font-weight="600" text-anchor="start">Spoken</text>
<rect x="168" y="326" width="742" height="46" rx="5" fill="#ffffff" stroke="#8a8886" stroke-width="1"/>
<text x="182" y="354" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1b1a19" font-weight="400" text-anchor="start">“Before we continue — make sure nobody can overhear you.”</text>
<line x1="95" y1="372" x2="95" y2="386" stroke="#8a8886" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="40" y="386" width="110" height="46" rx="5" fill="#fff8e6" stroke="#8a6100" stroke-width="1.4"/>
<text x="52" y="414" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8a6100" font-weight="600" text-anchor="start">Spoken</text>
<rect x="168" y="386" width="742" height="46" rx="5" fill="#ffffff" stroke="#8a8886" stroke-width="1"/>
<text x="182" y="414" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1b1a19" font-weight="400" text-anchor="start">Which town or city were you in the last time you signed in?</text>
<line x1="95" y1="432" x2="95" y2="446" stroke="#8a8886" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="40" y="446" width="110" height="46" rx="5" fill="#fff8e6" stroke="#8a6100" stroke-width="1.4"/>
<text x="52" y="474" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8a6100" font-weight="600" text-anchor="start">Spoken</text>
<rect x="168" y="446" width="742" height="46" rx="5" fill="#ffffff" stroke="#8a8886" stroke-width="1"/>
<text x="182" y="474" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1b1a19" font-weight="400" text-anchor="start">What kind of device or browser did you last sign in from?</text>
<line x1="95" y1="492" x2="95" y2="506" stroke="#8a8886" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="40" y="506" width="110" height="46" rx="5" fill="#effbef" stroke="#0e700e" stroke-width="1.4"/>
<text x="52" y="534" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#0e700e" font-weight="600" text-anchor="start">Listening</text>
<rect x="168" y="506" width="742" height="46" rx="5" fill="#ffffff" stroke="#8a8886" stroke-width="1"/>
<text x="182" y="534" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1b1a19" font-weight="400" text-anchor="start">Voice capture is OPEN only here — see Figure 3 for why that matters.</text>
<line x1="95" y1="552" x2="95" y2="566" stroke="#8a8886" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="40" y="566" width="110" height="46" rx="5" fill="#effbef" stroke="#0e700e" stroke-width="1.4"/>
<text x="52" y="594" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#0e700e" font-weight="600" text-anchor="start">Verdict</text>
<rect x="168" y="566" width="742" height="46" rx="5" fill="#ffffff" stroke="#8a8886" stroke-width="1"/>
<text x="182" y="594" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1b1a19" font-weight="400" text-anchor="start">Adjudicate: code, coercion, then voice. Speak the result. Hang up.</text>
<text x="40" y="644" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#a4262c" font-weight="600" text-anchor="start">Throughout: the coercion analyst re-scores the live transcript every three seconds.</text>
<text x="40" y="664" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#605e5c" font-weight="400" text-anchor="start">A correct code entered under instruction is refused. That is the whole point of the product.</text>
</svg>