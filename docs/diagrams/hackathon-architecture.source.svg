  <rect x="632" y="579" width="606" height="99" rx="10" fill="#def2ec" stroke="#8ecabd"/>
  <text x="650" y="616" fill="#146b55" font-size="24" font-weight="700">4  Deterministic verification decision</text>
  <text x="650" y="650" class="body">Coordinator + adjudicator; AI cannot grant access</text>
  <text x="638" y="713" class="body">EAM → signed result / refusal to Entra</text>
  <text x="638" y="748" class="body">Treasury → durable receipt → policy / grant checks</text>

