<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">EntraGuard — source-verified solution architecture</title>
  <desc id="desc">Two verification entry paths reach a single-replica Media Service in Azure Container Apps. Azure Communication Services carries calls and media, Azure AI Speech transcribes audio, Azure OpenAI scores conversation risk, and Microsoft Graph supplies contextual facts. Deterministic verification code controls outcomes. Supporting services are Azure Table Storage, an internal voiceprint Container App, Key Vault for EAM signing, and Log Analytics with Sentinel. The operator console receives SignalR events. This logical verification view is checked against repository source, not a live deployment audit.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#477999"/></marker>
    <style>
      text { font-family: 'Segoe UI', Arial, sans-serif; }
      .heading { fill:#12314b; font-size:27px; font-weight:700; }
      .body { fill:#294b63; font-size:22px; }
      .small { fill:#486579; font-size:19px; }
      .label { fill:#356582; font-size:18px; font-weight:600; }
      .card { fill:#ffffff; stroke:#c2d7e7; stroke-width:1.5; }
      .wire { fill:none; stroke:#477999; stroke-width:2; marker-end:url(#arrow); }
      .both { marker-start:url(#arrow); }
      .dependency { fill:none; stroke:#477999; stroke-width:2; }
    </style>
  </defs>
