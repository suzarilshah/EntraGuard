<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title"><title id="title">Verify the person. Assess the pressure.</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#566D62"/></marker></defs><g font-family="Arial, sans-serif"><rect width="1920" height="1080" fill="#F5F6F0"/><text x="96" y="74.75" text-anchor="start" font-size="25" fill="#17382F" font-weight="700"><tspan x="96" dy="0">ENTRAGUARD</tspan></text><text x="1820" y="72.28999999999999" text-anchor="end" font-size="19" fill="#566D62" font-weight="400"><tspan x="1820" dy="0">10–18s  /  HACKATHON FILM</tspan></text><path d="M96 1008 L1824 1008" stroke="#DCE4D6" stroke-width="3" fill="none" /><text x="96" y="1045.47" text-anchor="start" font-size="17" fill="#566D62" font-weight="400"><tspan x="96" dy="0">MICROSOFT GARAGE HACKATHON</tspan></text><text x="1824" y="1045.47" text-anchor="end" font-size="17" fill="#566D62" font-weight="400"><tspan x="1824" dy="0">02 / 06</tspan></text><text x="96" y="251.16" text-anchor="start" font-size="76" fill="#17382F" font-weight="700"><tspan x="96" dy="0">Verify the person.</tspan><tspan x="96" dy="93.48">Assess the pressure.</tspan></text><rect x="96" y="454" width="544" height="330" rx="24" fill="#FFFFFF" stroke="#DCE4D6"/><image href="data:image/svg+xml;base64," x="130" y="491" width="70" height="70" preserveAspectRatio="xMidYMid meet"/><text x="130" y="633.58" text-anchor="start" font-size="38" fill="#17382F" font-weight="700"><tspan x="130" dy="0">Work identity</tspan></text><text x="130" y="706.57" text-anchor="start" font-size="27" fill="#566D62" font-weight="400"><tspan x="130" dy="0">Start with Microsoft Entra ID.</tspan></text><rect x="688" y="454" width="544" height="330" rx="24" fill="#FFFFFF" stroke="#DCE4D6"/><image href="data:image/svg+xml;base64," x="722" y="491" width="70" height="70" preserveAspectRatio="xMidYMid meet"/><text x="722" y="633.58" text-anchor="start" font-size="38" fill="#17382F" font-weight="700"><tspan x="722" dy="0">Available context</tspan></text><text x="722" y="706.57" text-anchor="start" font-size="27" fill="#566D62" font-weight="400"><tspan x="722" dy="0">Ask about recent activity.</tspan></text><rect x="1280" y="454" width="544" height="330" rx="24" fill="#FFFFFF" stroke="#DCE4D6"/><image href="data:image/svg+xml;base64," x="1314" y="491" width="70" height="70" preserveAspectRatio="xMidYMid meet"/><text x="1314" y="633.58" text-anchor="start" font-size="38" fill="#17382F" font-weight="700"><tspan x="1314" dy="0">Conversation evidence</tspan></text><text x="1314" y="706.57" text-anchor="start" font-size="27" fill="#566D62" font-weight="400"><tspan x="1314" dy="0">Assess signs of coaching.</tspan></text><rect x="96" y="852" width="1728" height="74" rx="0" fill="#17382F" stroke="#17382F"/><text x="130" y="900.94" text-anchor="start" font-size="34" fill="#FFFFFF" font-weight="700"><tspan x="130" dy="0">AI supplies evidence. Code controls the outcome.</tspan></text></g></svg>