<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title"><title id="title">The code is right. The situation isn't.</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#566D62"/></marker></defs><g font-family="Arial, sans-serif"><rect width="1920" height="1080" fill="#0C252D"/><text x="96" y="74.75" text-anchor="start" font-size="25" fill="#D5EDAE" font-weight="700"><tspan x="96" dy="0">ENTRAGUARD</tspan></text><text x="1820" y="72.28999999999999" text-anchor="end" font-size="19" fill="#B4C8BE" font-weight="400"><tspan x="1820" dy="0">00–10s  /  HACKATHON FILM</tspan></text><path d="M96 1008 L1824 1008" stroke="#36554E" stroke-width="3" fill="none" /><text x="96" y="1045.47" text-anchor="start" font-size="17" fill="#B4C8BE" font-weight="400"><tspan x="96" dy="0">MICROSOFT GARAGE HACKATHON</tspan></text><text x="1824" y="1045.47" text-anchor="end" font-size="17" fill="#B4C8BE" font-weight="400"><tspan x="1824" dy="0">01 / 06</tspan></text><text x="96" y="313.26" text-anchor="start" font-size="86" fill="#FFFFFF" font-weight="700"><tspan x="96" dy="0">The code is right.</tspan><tspan x="96" dy="105.78">The situation isn’t.</tspan></text><text x="100" y="535.49" text-anchor="start" font-size="39" fill="#B4C8BE" font-weight="400"><tspan x="100" dy="0">A valid credential can still hide</tspan><tspan x="100" dy="47.97">a coached approval.</tspan></text><rect x="98" y="798" width="840" height="42" rx="8" fill="#163A3B" stroke="#163A3B"/><text x="110" y="824.29" text-anchor="start" font-size="19" fill="#D5EDAE" font-weight="700"><tspan x="110" dy="0">VERIFY THE PERSON. ASSESS THE PRESSURE.</tspan></text><rect x="1220" y="218" width="590" height="650" rx="28" fill="#163A3B" stroke="#36554E"/><text x="1515" y="296.02" text-anchor="middle" font-size="22" fill="#B4C8BE" font-weight="700"><tspan x="1515" dy="0">NUMBER MATCH</tspan></text><rect x="1320" y="345" width="390" height="212" rx="24" fill="#F5F6F0" stroke="#F5F6F0"/><text x="1515" y="493.5" text-anchor="middle" font-size="150" fill="#17382F" font-weight="700"><tspan x="1515" dy="0">47</tspan></text><text x="1515" y="651.85" text-anchor="middle" font-size="35" fill="#FFD0B8" font-weight="400"><tspan x="1515" dy="0">“Just enter the number.</tspan><tspan x="1515" dy="43.05">I’ll stay on the line.”</tspan></text><text x="1515" y="816.2" text-anchor="middle" font-size="20" fill="#B4C8BE" font-weight="400"><tspan x="1515" dy="0">Illustrative scenario</tspan></text></g></svg>