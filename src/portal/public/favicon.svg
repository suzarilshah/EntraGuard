<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The risk meter reduced to four segments, in Fluent's severity ramp:
       nominal, warning, severe, critical. Same semantics as the in-app RiskMeter. -->
  <rect width="32" height="32" rx="4" fill="#0F0F0F"/>
  <rect x="7"  y="20" width="4" height="6"  rx="1" fill="#107C10"/>
  <rect x="13" y="15" width="4" height="11" rx="1" fill="#FFB900"/>
  <rect x="19" y="10" width="4" height="16" rx="1" fill="#D83B01"/>
  <rect x="25" y="6"  width="2" height="20" rx="1" fill="#D13438"/>
</svg>
